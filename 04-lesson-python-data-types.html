<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Najm Code Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fd;--card:#fbfdff;--ink:#1b2250;--text:#26305e;--line:#dbe5f6;--purple:#5b3fd0;--blue:#2f5be0;--yellow:#fdeaa6;--dark:#17203a;
  --green:#16a05a;--sky:#2b7bf0;--pink:#ee3f86;--orange:#f5a01a;--violet:#7a5ae0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1530;--card:#151c3c;--ink:#f1f4ff;--text:#d7ddf5;--line:#2a3566;--yellow:#4a4020}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',Tahoma,sans-serif;background:var(--bg);color:var(--text);line-height:1.8}
.page{max-width:1024px;margin:0 auto;padding:0 38px;overflow:hidden;background:radial-gradient(circle at 15% 0,rgba(120,150,255,.12),transparent 40%),var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:26px 0 10px;gap:12px}
.laptop{width:270px;height:auto;flex:none;mix-blend-mode:multiply}
@media (prefers-color-scheme:dark){.laptop{mix-blend-mode:normal;border-radius:16px}}
.title{text-align:center;flex:1}
.title h1{font-size:60px;font-weight:900;color:var(--ink);line-height:1.15}
.title h2{font-size:42px;font-weight:800;color:var(--ink);line-height:1.3}
.title h2 span{color:var(--purple)}
.logo{width:210px;flex:none;direction:ltr}
.logo .najm{font-size:62px;font-weight:900;line-height:1;background:linear-gradient(90deg,#1d7bf0,#6a3df0 60%,#d63aa6);-webkit-background-clip:text;background-clip:text;color:transparent;position:relative;display:inline-block}
.logo .najm::before{content:"★";position:absolute;top:-16px;left:60px;font-size:20px;color:#f5b82e;-webkit-text-fill-color:#f5b82e}
.logo .ca{font-size:25px;font-weight:800;color:var(--ink);margin-top:-6px}
.logo .sw{display:block;width:190px;height:10px}
.intro{display:flex;align-items:center;gap:18px;margin:6px 0 22px}
.intro .bulb{width:70px;flex:none}
.intro p{background:var(--yellow);padding:14px 26px;border-radius:18px;font-size:19px;font-weight:600;color:var(--ink);flex:1;max-width:640px}
.sec{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:30px 26px 22px;margin:44px 0 26px;box-shadow:0 4px 20px rgba(60,80,160,.06)}
.pill{position:absolute;top:-30px;right:-6px;display:flex;align-items:center}
.pill .n{width:64px;height:64px;border-radius:50%;background:#fff;border:2.5px solid var(--purple);color:var(--purple);font-size:38px;font-weight:900;display:grid;place-items:center;z-index:2;box-shadow:0 3px 10px rgba(80,60,200,.2)}
.pill .t{background:linear-gradient(90deg,#4a3fd0,#7a52e0);color:#fff;font-size:25px;font-weight:800;padding:7px 56px 7px 26px;border-radius:40px 0 0 40px;margin-right:-34px;order:2}
.row{display:flex;align-items:center;gap:28px}
.txt,.info{flex:1;font-size:21px;font-weight:600;color:var(--ink)}
.txt p,.info p{margin-bottom:10px}
.art{width:300px;flex:none}
.art .b{transition:transform .3s;transform-origin:center bottom;cursor:pointer}
.art .b:hover{transform:translateY(-8px) scale(1.06)}
.formula{margin:14px 0;background:#e8f4f6;border:1.5px solid #cfe3e7;border-radius:12px;padding:10px 20px;font-weight:800;font-size:22px;display:flex;justify-content:space-around;color:#1b2250}
.formula b{color:var(--pink)}
.info ul{list-style:none;font-size:19px}
.info li::before{content:"●";color:var(--blue);margin-left:10px;font-size:13px}
.code{direction:ltr;background:var(--dark);border-radius:14px;padding:14px 22px 20px;width:360px;flex:none;color:#eaf0ff;font-family:'Fira Code',monospace;font-size:24px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.dots{display:flex;gap:8px;margin-bottom:12px}
.dots i{width:16px;height:16px;border-radius:50%}
.dots i:nth-child(1){background:#ff5f56}.dots i:nth-child(2){background:#ffbd2e}.dots i:nth-child(3){background:#27c93f}
.ln{display:flex;gap:26px;padding:3px 0;cursor:pointer;border-radius:6px;transition:background .2s}
.ln:hover{background:rgba(255,255,255,.08)}
.ln .no{color:#6f7aa0;width:14px}
.eq{color:#ff5fa8}.num{color:#4cd7e8}.st{color:#ffd166}
.out{font-size:16px;color:#9fe3a8;margin-top:10px;min-height:24px;border-top:1px dashed #3a4670;padding-top:8px}
.sub{font-size:20px;font-weight:700;color:var(--ink);margin:6px 0 16px}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;direction:ltr}
.ty{background:#fff;border:1.5px solid var(--c);border-radius:14px;padding:0 8px 12px;text-align:center;margin-top:26px;cursor:pointer;transition:transform .25s,box-shadow .25s;direction:rtl;color:#26305e}
.ty:hover,.ty.on{transform:translateY(-6px);box-shadow:0 10px 22px rgba(0,0,0,.14)}
.ty .no{width:48px;height:48px;border-radius:50%;background:var(--c);color:#fff;font-weight:900;font-size:26px;display:grid;place-items:center;margin:-24px auto 6px}
.ty h4{font-size:18px;font-weight:800;color:var(--c)}
.ty .ex{font-size:13px;color:#333}
.chips{background:color-mix(in srgb,var(--c) 10%,#fff);border:1px solid color-mix(in srgb,var(--c) 35%,#fff);border-radius:6px;padding:3px 4px;direction:ltr;font-family:'Fira Code',monospace;font-size:13px;display:flex;justify-content:space-around;gap:4px;margin-bottom:8px}
.ty p{font-size:14px;line-height:1.5;font-weight:600;min-height:64px;padding-top:4px}
.badge{display:inline-flex;gap:8px;align-items:center;justify-content:center;min-width:92px;height:42px;border-radius:9px;background:var(--c);color:#fff;font-weight:800;font-size:23px;padding:0 12px}
.badge.mk{background:none;padding:0}
.ck,.xx{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:24px;font-weight:900}
.ck{background:#2fb85a}.xx{background:#ee3b3b}
.demo{margin-top:16px;direction:ltr;background:var(--dark);color:#cfe0ff;border-radius:12px;padding:12px 18px;font-family:'Fira Code',monospace;font-size:16px;min-height:50px}
.note{display:flex;align-items:center;gap:18px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px 26px}
.note .sticky{width:100px;flex:none;transform:rotate(-6deg)}
.note p{flex:1;font-size:19px;font-weight:600;color:var(--ink)}
.note .star{width:110px;flex:none;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
footer{margin:26px -38px 0;line-height:0}
footer img{display:block;width:100%;height:auto}
.fade{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}
.fade.show{opacity:1;transform:none}
@media(max-width:820px){header{flex-direction:column}.title h1{font-size:42px}.title h2{font-size:28px}.row{flex-direction:column}.code{width:100%}.pill .t{font-size:18px;padding-left:16px}}
.qz{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:14px;scroll-margin-top:20px;transition:border-color .2s}
.qz.ok{border-color:#2fb85a}.qz.no{border-color:#ee3b3b}
.qt{font-size:19px;font-weight:700;color:var(--ink);margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.qn{flex:none;width:32px;height:32px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-size:17px;font-weight:800}
.qo{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;margin:6px 0;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-size:17px;font-weight:600;color:var(--ink);transition:background .2s,border-color .2s}
.qo:hover{border-color:var(--purple)}
.qo:has(input:checked){border-color:var(--purple);background:color-mix(in srgb,var(--purple) 12%,var(--card))}
.qo input{accent-color:var(--purple);margin-top:8px;flex:none}
.qbar{margin-top:8px}
.qbtn,.qhome{display:inline-block;background:linear-gradient(90deg,#4a3fd0,#7a52e0);color:#fff;border:0;border-radius:40px;padding:10px 34px;font:800 20px 'Cairo',Tahoma,sans-serif;cursor:pointer;text-decoration:none;box-shadow:0 4px 12px rgba(80,60,200,.3)}
.qres{margin-top:14px;font-size:18px;font-weight:700;color:var(--ink)}
.qres.bad{color:#ee3b3b}.qres.good{color:#16a05a}
.qres .qhome{margin-top:12px}
.qres a.qgo{color:var(--purple);text-decoration:underline;cursor:pointer;margin-inline-start:8px}
.row.wide{flex-direction:column;align-items:stretch}
.row.wide .code{width:100%;font-size:20px;overflow-x:auto}
.qcode{direction:ltr;text-align:left;background:var(--dark);color:#eaf0ff;font-family:'Fira Code',monospace;font-size:15px;border-radius:10px;padding:10px 14px;margin:0 0 10px;overflow-x:auto}
.qbar .qhome{background:none;color:var(--purple);border:2px solid var(--purple);box-shadow:none;padding:8px 28px;margin-inline-start:10px}
.qbar .qhome:hover{background:color-mix(in srgb,var(--purple) 12%,var(--card))}
/* ===== إصلاحات الموبايل والتخطيط ===== */
.pill{position:relative;top:auto;right:-6px;margin:-60px 0 6px;max-width:calc(100% + 6px)}
.pill .t{line-height:1.5}
.qbar{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:16px}
.qbar .qbtn,.qbar .qhome{width:min(100%,340px);text-align:center;margin:0}
@media(max-width:820px){
 header{flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px}
 .laptop{width:min(150px,38vw)}
 .logo{width:auto}
 .logo .najm{font-size:clamp(34px,10vw,50px)}
 .logo .ca{font-size:clamp(15px,4.4vw,21px)}
 .logo .sw{width:min(150px,36vw)}
 .title{order:3;flex:1 1 100%}
}
svg.art{direction:ltr}
.demo{overflow-wrap:anywhere}
.ln>span:last-child{white-space:nowrap}
.code.wrapcode .ln>span:last-child{white-space:normal;overflow-wrap:anywhere;flex:1;min-width:0}
</style>
</head>

          <text x="76" y="212" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" font-family="Cairo">String</text></g>
        <g class="b"><rect x="156" y="130" width="136" height="100" rx="16" fill="#f5a01a"/>
          <text x="224" y="180" text-anchor="middle" font-size="30" font-weight="500" fill="#1b2250" font-family="Fira Code, monospace">True</text>
          <text x="224" y="212" text-anchor="middle" font-size="16" font-weight="800" fill="#1b2250" font-family="Cairo">Boolean</text></g>
      </svg>`,
      paragraphs: [
        "قبل العمل مع متغيرات Python، من المهم أن نفهم أنواع البيانات (Data Types).",
        "نوع البيانات يصف نوع القيمة التي يحملها المتغير، فقد تكون القيمة مثلًا رقمًا أو نصًا.",
        "تستخدم لغات البرمجة أنواع البيانات لتعرف كيف تخزّن المعلومات المختلفة وكيف تتعامل معها." ] },

    /* 2) Dynamically typed */
    { type: "code", title: "Python لغة Dynamically Typed",
      intro: "Python لغة ذات كتابة ديناميكية (Dynamically Typed): لا تحتاج أن تحدد نوع المتغير عند إنشائه، فهي تحدد النوع من القيمة المسندة إليه. اضغط على السطرين:",
      bullets: [
        "المتغير name يحمل نصًا (String)، والمتغير age يحمل عددًا صحيحًا (Integer)." ],
      lines: [
        { code: "name = 'John Doe'", out: "Python تعرف أن هذا نص (String)" },
        { code: "age = 25",          out: "Python تعرف أن هذا عدد صحيح (Integer)" } ] },

    /* 3) تغيير النوع */
    { type: "code", title: "المتغير يمكن أن يغيّر نوعه",
      intro: "يمكن لاحقًا إسناد قيمة من نوع مختلف إلى نفس المتغير. اضغط على كل سطر:",
      bullets: [
        "بعد الإسناد الثاني، أصبح المتغير age يحمل نصًا (String) بدلًا من عدد صحيح (Integer)." ],
      lines: [
        { code: "age = 25",            out: "age → 25  (Integer)" },
        { code: "age = 'Twenty-five'", out: "age → 'Twenty-five'  (String)" } ] },

    /* 4) الأنواع الأربعة — بطاقات */
    { type: "cards", title: "أنواع البيانات الأربعة",
      intro: "ركّز الآن على أربعة أنواع ستستخدمها في هذه الوحدة. اضغط على كل بطاقة:",
      cards: [
        { color: "green",  name: "Integer", label: "عدد صحيح", examples: ["10","-5"],
          desc: "عدد صحيح بدون علامة عشرية، مثل 10 أو -5.", badge: "10",
          demo: "my_integer_var = 10    # Integer: 10" },
        { color: "sky",    name: "Float", label: "عدد عشري", examples: ["4.41","-0.4"],
          desc: "عدد له علامة عشرية، مثل 4.41 أو -0.4.", badge: "4.5",
          demo: "my_float_var = 4.50    # Float: 4.5" },
        { color: "pink",   name: "String", label: "نص", examples: ["'Hello world!'"],
          desc: "سلسلة من الحروف بين علامتي اقتباس مفردة أو مزدوجة.", badge: "' '",
          demo: "my_string_var = 'hello'    # String: hello" },
        { color: "orange", name: "Boolean", label: "قيمة منطقية", examples: ["True","False"],
          desc: "نوع له قيمتان فقط: صحيح أو خطأ، ويُكتب True أو False.", badge: "T/F",
          demo: "my_boolean_var = True    # Boolean: True" } ] },

    /* 5) تجربة الأنواع الأربعة — صندوق كود عريض */
    { type: "code", wide: true, title: "الأنواع الأربعة في كود",
      intro: "هذا مثال لكل نوع، مع دالة print() التي تعلمناها. اضغط على أي سطر لترى النتيجة:",
      bullets: [
        "لاحظ أن Python تطبع 4.5 عند طباعة القيمة 4.50.",
        "القيمة المنطقية تُكتب True أو False." ],
      lines: [
        { code: "my_integer_var = 10",                    out: "عدد صحيح (Integer)" },
        { code: "print('Integer:', my_integer_var)",      out: "Integer: 10" },
        { code: "my_float_var = 4.50",                    out: "عدد عشري (Float)" },
        { code: "print('Float:', my_float_var)",          out: "Float: 4.5" },
        { code: "my_string_var = 'hello'",                out: "نص (String)" },
        { code: "print('String:', my_string_var)",        out: "String: hello" },
        { code: "my_boolean_var = True",                  out: "قيمة منطقية (Boolean)" },
        { code: "print('Boolean:', my_boolean_var)",      out: "Boolean: True" } ] },

    /* 6) اختبار نهاية الدرس */
    { type: "quiz", title: "اختبر نفسك",
      intro: "جاوب على الأسئلة التالية ثم اضغط «تحقق من الإجابات» لتعرف نتيجتك. ويمكنك العودة للصفحة الرئيسية في أي وقت.",
      home: "index.html",
      questions: [
        { q: "ماذا يعني أن Python لغة ذات كتابة ديناميكية (Dynamically Typed)؟",
          options: [
            "يجب أن تحدد نوع بيانات كل متغير يدويًا.",
            "Python لا تدعم أنواع بيانات مختلفة.",
            "Python تحدد نوع البيانات تلقائيًا بناءً على القيمة المسندة.",
            "لا يمكن للمتغيرات في Python تغيير نوع بياناتها بعد الإسناد." ],
          answer: 2 },
        { q: "ما الفرق بين نوع البيانات Integer ونوع Float؟",
          options: [
            "يستطيع Integer تخزين الأعداد الموجبة والسالبة، بينما يخزّن Float الأعداد الموجبة فقط.",
            "يستهلك Float ذاكرة أقل من Integer في Python.",
            "يخزّن Integer أعدادًا حتى 1000 فقط، بينما لا يوجد حد لـ Float.",
            "Integer أعداد صحيحة بدون علامة عشرية، بينما Float أعداد لها علامة عشرية." ],
          answer: 3 },
        { q: "أي مما يلي هو النوع الذي قيمته True أو False في Python؟",
          options: [ "String", "Boolean", "Integer", "Float" ],
          answer: 1 } ] }
  ],

  note: "لدى Python أنواع بيانات أخرى أيضًا، وستتعلم كل نوع منها عندما تحتاج إليه لأول مرة."
};
/* ================== نهاية منطقة التعديل ================== */

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ar=t=>/[\u0600-\u06FF]/.test(t);
const bi=t=>esc(t.replace(/[(<]?[A-Za-z][A-Za-z0-9_'\-=+*\/]*(?:\([A-Za-z0-9_'\-=+*\/ ,.()]*\))?(?:[ .,]+[A-Za-z0-9_'\-=+*\/()<>]+)*[)>]?/g,m=>'\u0001'+m+'\u0002')).replace(/\u0001/g,'<bdi>').replace(/\u0002/g,'</bdi>');
const hl=s=>esc(s).replace(/(&quot;|"[^"]*"|'[^']*')/g,m=>m==='&quot;'?m:`<span class="st">${m}</span>`)
  .replace(/(^|[\s=(])(-?\d+(\.\d+)?)(?![^<]*>)/g,'$1<span class="num">$2</span>').replace(/ = /,' <span class="eq">=</span> ');
const COLORS={green:'--green',sky:'--sky',pink:'--pink',orange:'--orange',violet:'--violet'};
const BOX=`<svg class="art" viewBox="0 0 300 250"><g class="b"><ellipse cx="45" cy="52" rx="38" ry="30" fill="#1ea35a"/><text x="45" y="62" text-anchor="middle" fill="#fff" font-size="28" font-weight="800" font-family="Cairo">10</text></g><g class="b"><rect x="95" y="6" width="95" height="46" rx="20" fill="#2b7bf0"/><text x="142" y="38" text-anchor="middle" fill="#fff" font-size="24" font-weight="700" font-family="Cairo">"Hello"</text></g><g class="b"><ellipse cx="248" cy="54" rx="48" ry="30" fill="#ee3f86"/><text x="248" y="64" text-anchor="middle" fill="#fff" font-size="26" font-weight="800" font-family="Cairo">3.14</text></g><path d="M40 150l95-40 110 40-95 50z" fill="#e6b66a"/><path d="M40 150v60l110 38v-60z" fill="#d2994a"/><path d="M245 150v60l-95 38v-60z" fill="#be8538"/><path d="M40 150l-14-25 80-20 29 5zM245 150l22-26-80-18-22 7z" fill="#f0c882"/><text x="115" y="210" font-size="28" font-weight="800" fill="#2a1d5a" font-family="Cairo" transform="rotate(-20 115 210)">متغير</text></svg>`;

const L=LESSON, $=id=>document.getElementById(id);
document.title=L.title+' | Najm Code Academy';
$('h1').innerHTML=bi(L.title);
$('h2').innerHTML=bi(L.subtitle||'')+(L.highlight?` <span>${bi(L.highlight)}</span>`:'');
$('intro').innerHTML=bi(L.intro); $('note').innerHTML=bi(L.note);

$('sections').innerHTML=L.sections.map((s,i)=>{
  const pill=`<div class="pill"><div class="n">${i+1}</div><div class="t">${bi(s.title)}</div></div>`;
  let body='';
  if(s.type==='text') body=`<div class="row"><div class="txt">${s.paragraphs.map(p=>`<p>${bi(p)}</p>`).join('')}</div>${s.art==='box'?BOX:(s.art||'')}</div>`;
  if(s.type==='code') body=`<div class="row${s.wide?' wide':''}"><div class="info"><p>${bi(s.intro||'')}</p>`+
    (s.formula?`<div class="formula"><span>${esc(s.formula[0])}</span><b>${esc(s.formula[1])}</b><span>${esc(s.formula[2])}</span></div>`:'')+
    (s.bullets?`<ul>${s.bullets.map(b=>`<li>${bi(b)}</li>`).join('')}</ul>`:'')+`</div>
    <div class="code"><div class="dots"><i></i><i></i><i></i></div>`+
    s.lines.map((l,n)=>`<div class="ln" data-o="${esc(l.out||'')}"><span class="no">${n+1}</span><span>${hl(l.code)}</span></div>`).join('')+
    `<div class="out">▶ اضغط على سطر</div></div></div>`;
  if(s.type==='cards') body=`<p class="sub">${bi(s.intro||'')}</p><div class="types">`+s.cards.map((c,n)=>`
    <div class="ty" style="--c:var(${COLORS[c.color]||'--green'})" data-demo="${esc(c.demo||'')}">
      <div class="no">${n+1}</div><h4>${esc(c.name)} <small>(${esc(c.label)})</small></h4><div class="ex">مثال:</div>
      <div class="chips">${c.examples.map(e=>`<span>${esc(e)}</span>`).join('')}</div><p>${bi(c.desc)}</p>
      ${c.badge==='check'?'<div class="badge mk"><span class="ck">✓</span><span class="xx">✕</span></div>':`<div class="badge">${esc(c.badge)}</div>`}</div>`).join('')+
    `</div><div class="demo">▶ اضغط على أي بطاقة لترى مثالًا</div>`;
  if(s.type==='quiz') body=`<p class="sub">${bi(s.intro||'')}</p>`+s.questions.map((q,n)=>`<div class="qz" id="q${i}-${n}" data-a="${q.answer}"><div class="qt" dir="${ar(q.q)?'rtl':'ltr'}"><span class="qn">${n+1}</span><span>${bi(q.q)}</span></div>${q.code?`<pre class="qcode">${esc(q.code)}</pre>`:''}`+
    q.options.map((o,k)=>`<label class="qo" dir="${ar(o)?'rtl':'ltr'}"><input type="radio" name="q${i}-${n}" value="${k}"><span>${bi(o)}</span></label>`).join('')+`</div>`).join('')+
    `<div class="qbar" data-home="${esc(s.home||'#')}"><button class="qbtn" type="button">تحقق من الإجابات</button><a class="qhome" href="${esc(s.home||'#')}">العودة للصفحة الرئيسية</a></div><div class="qres" aria-live="polite"></div>`;
  return `<section class="sec fade">${pill}${body}</section>`;
}).join('');

/* التفاعل */
document.querySelectorAll('.sec').forEach(sec=>{
  const out=sec.querySelector('.out');
  sec.querySelectorAll('.ln').forEach(l=>l.onclick=()=>out.textContent='▶ '+l.dataset.o);
  const demo=sec.querySelector('.demo');
  sec.querySelectorAll('.ty').forEach(c=>c.onclick=()=>{
    sec.querySelectorAll('.ty').forEach(x=>x.classList.remove('on'));c.classList.add('on');demo.textContent='>>> '+c.dataset.demo;});
  const qb=sec.querySelector('.qbtn');
  if(qb){
    const res=sec.querySelector('.qres'), home=sec.querySelector('.qbar').dataset.home;
    const qs=[...sec.querySelectorAll('.qz')];
    const reset=()=>{res.className='qres';res.innerHTML='';qs.forEach(q=>q.classList.remove('ok','no'))};
    sec.querySelectorAll('.qz input').forEach(r=>r.onchange=reset);
    const links=ids=>ids.map(n=>`<a class="qgo" href="#q" data-t="${qs[n].id}">السؤال ${n+1}</a>`).join(' ');
    qb.onclick=()=>{
      const empty=[],bad=[];
      qs.forEach((q,n)=>{q.classList.remove('ok','no');const c=q.querySelector('input:checked');
        if(!c)empty.push(n);else if(+c.value===+q.dataset.a){q.classList.add('ok')}else{q.classList.add('no');bad.push(n)}});
      if(empty.length){res.className='qres bad';res.innerHTML='لم تجب بعد على: '+links(empty);}
      else if(bad.length){res.className='qres bad';res.innerHTML='هناك إجابة غير صحيحة في: '+links(bad)+'<br>راجع الإجابة وحاول مرة أخرى.';}
      else{res.className='qres good';res.innerHTML='✓ أحسنت! أجبت على كل الأسئلة بشكل صحيح.';}
      res.querySelectorAll('.qgo').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.t).scrollIntoView({behavior:'smooth',block:'center'})});
    };
  }
});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('show');io.unobserve(e.target)}}),{threshold:.1});
document.querySelectorAll('.fade').forEach(el=>io.observe(el));

/* يضبط حجم خط صندوق الكود تلقائيًا حسب عرض الصندوق، فلا يخرج أي سطر عن حدوده */
const MIN_FS=12;
const fitCode=()=>{document.querySelectorAll('.code').forEach(box=>{
  box.style.fontSize=''; box.classList.remove('wrapcode');
  const lns=[...box.querySelectorAll('.ln')]; if(!lns.length)return;
  let fs=parseFloat(getComputedStyle(box).fontSize)||24;
  const over=()=>lns.some(l=>l.scrollWidth>l.clientWidth+1);
  if(over()){
    const r=Math.max(...lns.map(l=>l.scrollWidth/Math.max(l.clientWidth,1)));
    fs=Math.max(fs/r*0.98,MIN_FS); box.style.fontSize=fs+'px';
    for(let i=0;i<12&&over()&&fs>MIN_FS;i++){fs=Math.max(fs*0.95,MIN_FS);box.style.fontSize=fs+'px';}
    if(over())box.classList.add('wrapcode');  /* أصغر حجم مقروء: نسمح للسطر بالنزول لسطر ثانٍ بدل تصغير الخط أكثر */
  }
});};
fitCode();
window.addEventListener('load',fitCode);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitCode);
if(typeof ResizeObserver!=='undefined'){
  const lastW=new WeakMap();
  const ro=new ResizeObserver(es=>{let ch=false;es.forEach(e=>{const w=Math.round(e.contentRect.width);if(lastW.get(e.target)!==w){lastW.set(e.target,w);ch=true}});if(ch)fitCode();});
  document.querySelectorAll('.code').forEach(b=>ro.observe(b));
}else window.addEventListener('resize',fitCode);
</script>
</body>
</html>
